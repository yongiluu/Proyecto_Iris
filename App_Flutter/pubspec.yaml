name: iris_app
description: "Iris - Asistente Visual para personas con discapacidad visual. PoC Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Control de la cámara del dispositivo
  camera: ^0.11.1

  # Síntesis de voz nativa (Text-to-Speech)
  flutter_tts: ^4.2.0

  # Peticiones HTTP a las APIs de IA
  http: ^1.3.0

  # Retroalimentación háptica (vibración)
  vibration: ^3.1.8

  speech_to_text: ^7.4.0
  permission_handler: ^12.0.1
  flutter_dotenv: ^6.0.1
  geolocator: ^14.0.3
  flutter_blue_plus: ^2.3.12
  path_provider: ^2.1.6
  archive: ^4.5.2
  share_plus: ^13.3.1
  record: ^7.1.2
  tflite_flutter: ^0.12.1
  image: ^4.12.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    # OJO: todo lo que esté en .env queda dentro del APK y se puede extraer.
    # Para producción mover las llamadas a Azure/HuggingFace a un backend propio.
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21

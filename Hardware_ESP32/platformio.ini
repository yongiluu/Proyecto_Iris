[platformio]
default_envs = esp32-s3-devkitc-1

; Configuracion comun a ambas placas
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    espressif/esp32-camera @ ^2.0.4
    tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0

; Prototipo grande. El monitor serial sale por el puerto UART de la placa.
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    -DBOARD_HAS_PSRAM
    -DIRIS_DEVKIT

; Prototipo 2. Serial por el USB nativo del ESP32-S3.
[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DIRIS_XIAO

; Firmware de captura de datos para entrenar (ML_Training/audio/capture_from_board.py).
; Envia el microfono crudo por USB; no usa BLE ni camara.
[env:esp32-s3-devkitc-1_audio_capture]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DIRIS_AUDIO_CAPTURE
monitor_speed = 921600

[env:seeed_xiao_esp32s3_audio_capture]
extends = env:seeed_xiao_esp32s3
build_flags =
    ${env:seeed_xiao_esp32s3.build_flags}
    -DIRIS_AUDIO_CAPTURE

; Firmware de captura de fotos para entrenar (ML_Training/vision/capture_photos.py).
; Envia por USB los frames 96x96 en grises que ve el modelo; no usa BLE ni microfono.
; Solo para la XIAO (prototipo 2).
[env:seeed_xiao_esp32s3_photo_capture]
extends = env:seeed_xiao_esp32s3
build_flags =
    ${env:seeed_xiao_esp32s3.build_flags}
    -DIRIS_PHOTO_CAPTURE

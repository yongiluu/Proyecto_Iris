[platformio]
default_envs = esp32-s3-devkitc-1
extra_configs = secrets*.ini

; Configuracion comun a ambas placas
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
; TensorFlow Lite Micro va en lib/TensorFlowLite_ESP32: es tanakamasayuki/TensorFlowLite_ESP32 1.0.0
; con los kernels optimizados ESP-NN de Espressif para el ESP32-S3 (ver lib/TensorFlowLite_ESP32/IRIS.md).
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    espressif/esp32-camera @ ^2.0.4

; Clave de la red "Iris-Actualizar" que abre la placa para actualizarse por WiFi (ACTUALIZAR_POR_WIFI.md).
; Para cambiarla sin subirla a GitHub, crea secrets.ini (esta en .gitignore) con:
;   [ota]
;   password = otra-clave-de-8-o-mas
[ota]
password = IrisOTA2026

; Kernels ESP-NN con instrucciones vectoriales del ESP32-S3 (conv, depthwise, FC, pooling, softmax).
[iris]
espnn_flags =
    -DESP_NN=1
    -DCONFIG_NN_OPTIMIZED=1

; Prototipo grande. El monitor serial sale por el puerto UART de la placa.
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    -DBOARD_HAS_PSRAM
    -DIRIS_DEVKIT
    ${iris.espnn_flags}

; Prototipo 2. Serial por el USB nativo del ESP32-S3.
[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DIRIS_XIAO
    ${iris.espnn_flags}
    ; Mas buffers BLE (12 por defecto): fotos y audio sin paquetes perdidos (~4 KB de RAM interna)
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24
    -DIRIS_OTA_PASSWORD=\"${ota.password}\"
; La tarea interna de la camara tiene 2 KB de pila: se parchea a 6 KB (tools/patch_camera_stack.py)
extra_scripts = pre:tools/patch_camera_stack.py

; Igual que seeed_xiao_esp32s3, pero se sube por WiFi (caja cerrada). Antes, pon la placa en modo
; actualizacion (boton de Iris 15 s) y conecta el PC a la red "Iris-Actualizar".
; tools/subir_por_wifi.py hace todo solo.
[env:seeed_xiao_esp32s3_ota]
extends = env:seeed_xiao_esp32s3
upload_protocol = custom
upload_command = curl.exe --fail --show-error --max-time 180 -u iris:${ota.password} -F "firmware=@$SOURCE" http://192.168.4.1/update

; Firmware de captura de datos para entrenar (ML_Training/audio/capture_from_board.py).
; Envia el microfono crudo por USB; no usa BLE ni camara.
[env:esp32-s3-devkitc-1_audio_capture]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DIRIS_AUDIO_CAPTURE
monitor_speed = 921600

[env:seeed_xiao_esp32s3_audio_capture]
extends = env:seeed_xiao_esp32s3
build_flags =
    ${env:seeed_xiao_esp32s3.build_flags}
    -DIRIS_AUDIO_CAPTURE

; Firmware de captura de fotos para entrenar (ML_Training/vision/capture_photos.py).
; Envia por USB los frames 96x96 en grises que ve el modelo; no usa BLE ni microfono.
; Solo para la XIAO (prototipo 2).
[env:seeed_xiao_esp32s3_photo_capture]
extends = env:seeed_xiao_esp32s3
build_flags =
    ${env:seeed_xiao_esp32s3.build_flags}
    -DIRIS_PHOTO_CAPTURE

; Mismo firmware de la XIAO pero con los kernels de referencia de TFLM (sin ESP-NN), para comparar
; tiempos o descartar un problema de los kernels optimizados. El autotest al arrancar imprime ambos.
[env:seeed_xiao_esp32s3_tflm_ref]
extends = env:seeed_xiao_esp32s3
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DIRIS_XIAO
